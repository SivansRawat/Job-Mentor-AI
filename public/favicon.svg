<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Border Gradient: Vibrant Blue Theme (Sky -> Sapphire -> Ocean -> Cyan) -->
    <linearGradient id="blueBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Deep Navy Background -->
    <linearGradient id="blueBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Monogram Gradient: Cyan to Sky Blue -->
    <linearGradient id="blueTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- AI Sparkle Glow -->
    <linearGradient id="blueSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Outer Rounded Container with Vibrant Blue Border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#blueBorderGrad)" />
  
  <!-- Inner Dark Navy Background Container -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="url(#blueBgGrad)" />

  <!-- Bold Monogram 'JM' -->
  <text x="31" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="27" text-anchor="middle" fill="url(#blueTextGrad)" letter-spacing="-1.5">JM</text>

  <!-- AI Sparkle in Top Right -->
  <path d="M47 11 Q47 16 52 16 Q47 16 47 21 Q47 16 42 16 Q47 16 47 11 Z" fill="url(#blueSparkleGrad)" />
</svg>
