<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" fill="none">
  <defs>
    <!-- Border Gradient: Vibrant Blue Theme -->
    <linearGradient id="blueBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Inner Navy Background -->
    <linearGradient id="blueBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Monogram Gradient -->
    <linearGradient id="blueTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Sparkle Glow -->
    <linearGradient id="blueSparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="blueTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- AI Badge Gradient -->
    <linearGradient id="blueBadgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563eb" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect x="6" y="10" width="80" height="80" rx="22" fill="url(#blueBorderGrad)" filter="url(#shadow)" />
  
  <!-- Inner Navy Background -->
  <rect x="9.5" y="13.5" width="73" height="73" rx="18.5" fill="url(#blueBgGrad)" />

  <!-- Monogram JM -->
  <text x="45" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" text-anchor="middle" fill="url(#blueTextGrad)" letter-spacing="-2">JM</text>

  <!-- AI Sparkle in Icon Tile -->
  <path d="M65 22 Q65 29 72 29 Q65 29 65 36 Q65 29 58 29 Q65 29 65 22 Z" fill="url(#blueSparkleGrad)" />

  <!-- Brand Title: Job Mentor -->
  <text x="106" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="url(#blueTitleGrad)" letter-spacing="-0.5">Job Mentor</text>

  <!-- AI Badge -->
  <rect x="332" y="32" width="54" height="32" rx="9" fill="url(#blueBadgeGrad)" />
  <text x="359" y="54" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="19" text-anchor="middle" fill="#ffffff" letter-spacing="0.5">AI</text>
</svg>
